[package]
name = "wadb"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "Keeps the ADB server alive so paired Android phones stay available for wireless debugging, with a terminal UI for QR pairing"
license = "Apache-2.0"
repository = "https://github.com/hamen/wadb"
readme = "README.md"
keywords = ["adb", "android", "wireless-debugging", "tui"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
mdns-sd = "0.14"
qrcode = { version = "0.14", default-features = false }
# Only the crossterm backend is used; the default set also pulls termina and termwiz.
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
rand = "0.9"
rpassword = "7"
zeroize = "1"
# The blocking API, on async-io rather than tokio: the rest of this crate is synchronous, and
# ksni's default feature set pulls in a tokio runtime for what is a DBus object with a menu on it.
# async-io is still a reactor, but a far smaller one, and nothing here awaits.
ksni = { version = "0.3", default-features = false, features = ["blocking", "async-io"] }

[profile.release]
strip = true
